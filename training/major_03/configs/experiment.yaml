# major_2_03 MOSS-Realtime distillation experiment

voice_ref: data/voices/major/major_2_03_cleaned.wav
teacher: v15
corpus: corpus/texts.jsonl
train_raw: train_raw.jsonl

parallel:
  num_shards: 2
  gpus: [0, 1]
  ports: [8014, 8015]
  staging_dir: /dev/shm/major03_wavs
  teachers: v15

sft:
  noref: true
  lora_r: 16
  epochs: 12
  lr: 3.0e-6
  grad_accum: 4
  warmup_ratio: 0

export:
  checkpoint: checkpoints/latest
  merged: exports/merged

qc:
  wav_dir: wavs/v15
  wav_dir_pruned: wavs/v15_pruned
  end_buffer_ms: 500
  stt_api: http://localhost:8603/v1/audio/transcriptions

serve:
  api_url: http://127.0.0.1:8016
  native_voice: true
  # warm_092_072 (MOSS_RT_* defaults in app/moss_api.py)
  sampling:
    audio_temperature: 0.92
    audio_top_p: 0.72
    audio_top_k: 40
    audio_repetition_penalty: 1.05
